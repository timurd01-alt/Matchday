<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 460px; max-height: 560px; overflow-y: auto;
    font: 13px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0; background: #0b0d12; color: #e8ecf3;
  }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #1c2029; position: sticky; top: 0; background: #0b0d12; }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; }
  #tabs button {
    background: none; border: none; color: #9aa4b2; font-size: 12px;
    padding: 4px 8px; cursor: pointer; border-radius: 5px;
  }
  #tabs button.active { color: #e8ecf3; background: #171b24; }
  section { padding: 10px 12px; }
  section[hidden] { display: none; }

  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #1c2029; white-space: nowrap; }
  th { color: #6b7280; font-weight: 500; position: sticky; top: 0; background: #0b0d12; }
  td.match { white-space: normal; max-width: 140px; }
  .pos { color: #4ade80; }
  .neg { color: #f87171; }
  .spread-hi { color: #f59e0b; font-weight: 600; }
  .spark { width: 60px; height: 16px; color: #60a5fa; vertical-align: middle; }
  #empty { color: #6b7280; padding: 20px 0; text-align: center; }
  #clear { margin-top: 10px; width: 100%; background: #171b24; color: #e8ecf3; border: 1px solid #2a2f3a; border-radius: 6px; padding: 6px; cursor: pointer; font-size: 12px; }

  label { display: block; margin-bottom: 4px; color: #9aa4b2; }
  input { width: 100%; box-sizing: border-box; padding: 5px; margin-bottom: 10px; background: #171b24; color: #e8ecf3; border: 1px solid #2a2f3a; border-radius: 5px; }
  .hint { font-size: 10.5px; color: #6b7280; margin: -6px 0 10px; }
  #save { width: 100%; padding: 7px; background: #171b24; color: #e8ecf3; border: 1px solid #2a2f3a; border-radius: 6px; cursor: pointer; }
  #status { font-size: 11px; color: #6b7280; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>Matchday edge overlay</h1>
  <div id="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="settings">Settings</button>
  </div>
</header>

<section id="dashboard">
  <table id="marketTable">
    <thead>
      <tr><th>Match</th><th>Model</th><th>Books</th><th>Poly</th><th>Kalshi</th><th>Spread</th><th>Trend</th></tr>
    </thead>
    <tbody id="marketRows"></tbody>
  </table>
  <div id="empty" hidden>No markets watched yet. Visit a Polymarket match page.</div>
  <button id="clear">Clear history</button>
</section>

<section id="settings" hidden>
  <label for="origin">Matchday data origin</label>
  <input id="origin" placeholder="https://matchdayterminal.com">

  <label for="oddsApiKey">Odds API key (your own, not Matchday's)</label>
  <input id="oddsApiKey" placeholder="from the-odds-api.com">
  <div class="hint">Bookmaker consensus is skipped without this.</div>

  <label for="oddsApiRegion">Odds API region</label>
  <input id="oddsApiRegion" placeholder="eu">

  <label for="kalshiApiKey">Kalshi API key (optional)</label>
  <input id="kalshiApiKey" placeholder="only if market listing needs auth">

  <label for="alertThreshold">Alert threshold (points, 0 = off)</label>
  <input id="alertThreshold" placeholder="e.g. 5" inputmode="decimal">
  <div class="hint">Pulses the panel and fires a browser notification when the spread across markets (or model-vs-Polymarket edge) crosses this many points.</div>

  <button id="save">Save</button>
  <div id="status"></div>
</section>

<script src="popup.js"></script>
</body>
</html>
