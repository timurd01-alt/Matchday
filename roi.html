<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Matchday</title>
<style>
  body{background:#0b0d12;color:#e8ecf3;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:2rem}
  .wrap{max-width:920px;margin:0 auto}
  h1{font-size:1.1rem;font-weight:600;margin:0 0 1rem}
  select,button{background:#171b24;color:#e8ecf3;border:1px solid #2a2f3a;border-radius:6px;padding:.4rem .6rem;font-size:.9rem}
  table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:.85rem}
  th,td{text-align:left;padding:.4rem .6rem;border-bottom:1px solid #1c2029}
  th{color:#9aa4b2;font-weight:500}
  .pos{color:#4ade80}
  .neg{color:#f87171}
  .muted{color:#6b7280;font-size:.8rem;margin-top:1rem}
  .empty{color:#6b7280;padding:2rem 0}
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="empty">Not available.</p>
</div>
<script>
(function () {
  var LS_NAME = "mdxRoiToken";
  var app = document.getElementById("app");

  var params = new URLSearchParams(window.location.search);
  var incoming = params.get("key");
  if (incoming) {
    localStorage.setItem(LS_NAME, incoming);
    params.delete("key");
    var clean = window.location.pathname + (params.toString() ? "?" + params.toString() : "");
    history.replaceState({}, "", clean);
  }

  var token = localStorage.getItem(LS_NAME);
  if (!token) return; // page stays on the generic "Not available." state

  var COMPS = ["epl", "ucl", "laliga", "seriea", "bundesliga", "ligue1", "wc",
               "nfl", "ncaaf", "nba", "ncaam", "mlb", "nhl"];

  function render(comp, payload) {
    var rows = (payload && payload.rows) || [];
    var html = '<h1>Model vs. market edge</h1>';
    html += '<select id="comp">' + COMPS.map(function (c) {
      return '<option value="' + c + '"' + (c === comp ? " selected" : "") + '>' + c.toUpperCase() + '</option>';
    }).join("") + '</select>';
    if (!rows.length) {
      html += '<p class="empty">No upcoming graded matches for this competition right now.</p>';
    } else {
      html += '<table><thead><tr><th>Match</th><th>Pick</th><th>Model %</th><th>Market %</th>' +
        '<th>Edge (pts)</th><th>ROI proxy</th></tr></thead><tbody>';
      rows.forEach(function (r) {
        var cls = r.edgePoints > 0 ? "pos" : r.edgePoints < 0 ? "neg" : "";
        html += "<tr><td>" + r.home + " vs " + r.away + "</td><td>" + (r.pickName || r.pick) + "</td>" +
          "<td>" + r.modelPct + "%</td><td>" + r.marketPct + "%</td>" +
          '<td class="' + cls + '">' + (r.edgePoints > 0 ? "+" : "") + r.edgePoints + "</td>" +
          '<td class="' + cls + '">' + (r.roiPct > 0 ? "+" : "") + r.roiPct + "%</td></tr>";
      });
      html += "</tbody></table>";
    }
    html += '<p class="muted">Market % is the bookmaker no-vig consensus already shown elsewhere on the site. ' +
      "Prediction-market comparison (Polymarket, Kalshi) is not connected yet. Not betting advice.</p>";
    app.innerHTML = html;
    document.getElementById("comp").addEventListener("change", function (e) {
      load(e.target.value);
    });
  }

  function load(comp) {
    app.innerHTML = '<p class="empty">Loading…</p>';
    fetch("/api/roi?comp=" + encodeURIComponent(comp), {
      headers: { Authorization: "Bearer " + token },
    }).then(function (res) {
      if (res.status === 401) {
        localStorage.removeItem(LS_NAME);
        app.innerHTML = '<p class="empty">Not available.</p>';
        throw new Error("unauthorized");
      }
      return res.json();
    }).then(function (payload) {
      render(comp, payload);
    }).catch(function () {
      if (app.innerHTML.indexOf("Loading") !== -1) {
        app.innerHTML = '<p class="empty">Could not load data.</p>';
      }
    });
  }

  load(COMPS[0]);
})();
</script>
</body>
</html>
