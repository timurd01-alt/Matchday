name: Preview Matchday Terminal X bot (publishing paused)

on:
  workflow_dispatch:

concurrency:
  group: matchday-terminal-x-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Publishing is intentionally paused until Matchday Terminal has an X
      # account and the owner explicitly asks to reconnect it. This workflow
      # has no secrets, publish switch, automatic trigger, or write operation.
      - name: Preview next promotion without publishing
        run: python x_bot.py --dry-run
