name: Promote Matchday Terminal on X

on:
  workflow_run:
    workflows: ["Refresh data and deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the next post without publishing
        required: true
        default: true
        type: boolean
      reconcile_key:
        description: Ambiguous campaign key to resolve after checking the X account
        required: false
        type: string
      reconcile_as:
        description: Result found during manual reconciliation
        required: true
        default: success
        type: choice
        options: [success, failed]
      reconcile_post_id:
        description: Required X post ID when reconciling as success
        required: false
        type: string

concurrency:
  group: matchday-terminal-x-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Restore publication ledger
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .x_bot_state.json
          key: matchday-x-bot-${{ github.run_id }}
          restore-keys: matchday-x-bot-

      - name: Preview next promotion
        if: (github.event_name != 'workflow_dispatch' || inputs.reconcile_key == '') && (vars.X_BOT_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
        run: python x_bot.py --dry-run

      - name: Reconcile an ambiguous publication
        if: github.event_name == 'workflow_dispatch' && inputs.reconcile_key != ''
        env:
          RECONCILE_KEY: ${{ inputs.reconcile_key }}
          RECONCILE_AS: ${{ inputs.reconcile_as }}
          RECONCILE_POST_ID: ${{ inputs.reconcile_post_id }}
        run: python x_bot.py --resolve-key "$RECONCILE_KEY" --resolution "$RECONCILE_AS" --post-id "$RECONCILE_POST_ID"

      - name: Publish one promotion
        id: publish
        continue-on-error: true
        if: (github.event_name != 'workflow_dispatch' || inputs.reconcile_key == '') && vars.X_BOT_ENABLED == 'true' && (github.event_name == 'workflow_run' || ! inputs.dry_run)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python x_bot.py --publish

      - name: Preserve the private publication audit ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: x-publication-ledger-${{ github.run_id }}
          path: .x_bot_state.json
          if-no-files-found: ignore
          retention-days: 90

      # Save even when X returned an ambiguous result. The pre-call attempt
      # receipt then blocks a retry while the account is reconciled manually.
      - name: Save publication ledger for deduplication
        if: always() && hashFiles('.x_bot_state.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .x_bot_state.json
          key: matchday-x-bot-${{ github.run_id }}

      - name: Fail after preserving an unsuccessful publication receipt
        if: steps.publish.outcome == 'failure'
        run: |
          echo "The X publication failed or needs reconciliation; its private receipt was preserved."
          exit 1
