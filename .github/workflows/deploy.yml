name: Refresh data and deploy

on:
  schedule:
    # Matchday publishes pregame analysis and postgame grading, not live
    # scores. Hourly checks are enough to lock near-kickoff picks and collect
    # final results without spending scarce provider quota on scoreboard duty.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      quota_bootstrap:
        description: 'Allow one deliberate call per protected provider when the private quota ledger is missing'
        required: false
        type: boolean
        default: false
      force_rebuild:
        description: 'Ignore adaptive cadence once and rebuild every competition'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Scheduled runs fail closed on a cold cache. A human may explicitly
      # authorize one bootstrap response so real provider headers can seed the
      # private ledger; ordinary dispatches remain protected too.
      MATCHDAY_QUOTA_ALLOW_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.quota_bootstrap && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Restore fetch state (odds, CI cadence)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .ci_fetch_state.json
            provider_quota_state.json
            data.json
            data_*.json
            odds_open*.json
            title_open*.json
            *_cache.json
            # odds_market_cache_<comp>.json / outrights_market_cache_<comp>.json /
            # api_football_box_cache_<comp>.json put "cache" BEFORE the per-
            # competition suffix, so *_cache.json (which needs the filename to
            # END in "_cache.json") never matched them -- confirmed via
            # fnmatch: 'odds_market_cache_wc.json' against '*_cache.json' is
            # False. Their on-disk caches (see ODDS_CACHE_MIN / OUTRIGHTS_CACHE_MIN
            # in fetch_data.py) were therefore never actually restored between
            # hourly runs; every run re-fetched from the provider regardless of
            # the intended cache window, silently burning Odds API / API-Football
            # quota faster than the cache durations were designed for.
            odds_market_cache_*.json
            outrights_market_cache_*.json
            api_football_box_cache_*.json
            advanced_metrics_*.json
            nflverse_pbp_*.csv.gz
            forecast_ledger_*.jsonl
            mlb_shadow_ledger.jsonl
            market_snapshot_ledger.jsonl
            market_benchmark_report.json
            nfl_availability_ledger.jsonl
            nfl_prospective_scorecard.json
            mlb_prospective_scorecard.json
            player_db_*.json
            posts.json
            posts_state.json
            posts/*.html
            fetch_failure_*.json
          key: matchday-fetch-state-${{ github.run_id }}
          restore-keys: matchday-fetch-state-

      # CLAUDE.md documents these three as required before considering any
      # prediction/data/provider change complete, but nothing previously
      # enforced that -- a regression could merge to main and start
      # deploying hourly with the suite never having actually run. Runs
      # early enough to block both the ratings/picks commit and the site
      # deploy below if it fails, since a broken prediction/provider path
      # is exactly what those steps would otherwise ship.
      - name: Run required test suite
        run: python -m unittest test_model_inputs test_provider_adapters test_generate_posts test_pregame_context test_market_benchmark test_x_bot test_provider_quota test_mlb_recovery test_mlb_shadow_ledger test_mlb_prospective_scorecard test_mlb_model_promotion test_mlb_forecast_pause test_nfl_challenger test_nfl_challenger_store test_nfl_availability test_nfl_prospective_scorecard test_nfl_model_adjustment test_cfb_challenger

      - name: Recover published last-good fixtures after a cold cache miss
        run: python recover_published_data.py

      - name: Reconcile official picks into append-only forecast ledgers
        run: python reconcile_forecast_ledgers.py

      - name: Write private keys from secrets (never committed)
        run: |
          cat > config_keys.py <<EOF
          CFBD_KEY = "${{ secrets.CFBD_KEY }}"
          CBBD_KEY = "${{ secrets.CBBD_KEY }}"
          FOOTBALL_DATA_KEY = "${{ secrets.FOOTBALL_DATA_KEY }}"
          ODDS_API_KEY = "${{ secrets.ODDS_API_KEY }}"
          API_FOOTBALL_KEY = "${{ secrets.API_FOOTBALL_KEY }}"
          BALLDONTLIE_KEY = "${{ secrets.BALLDONTLIE_KEY }}"
          BBS_API_KEY = "${{ secrets.BBS_API_KEY }}"
          SPORTSGAMEODDS_KEY = "${{ secrets.SPORTSGAMEODDS_KEY }}"
          SPORTSDATAIO_KEY = "${{ secrets.SPORTSDATAIO_KEY }}"
          EOF

      # updates.js is generated from updates/*.json and committed only so a
      # plain static file server works locally. Regenerating here means a
      # forgotten `python build_updates.py` can never ship a stale release-note
      # list or a stale build label (both are now derived from the newest
      # entry), and --check fails loudly if the committed copy had drifted.
      - name: Verify and rebuild release notes
        run: |
          python build_updates.py --check || echo "::warning::updates.js was out of sync with updates/; rebuilding"
          python build_updates.py

      - name: Recover durable NCAAF roster talent before shared quota use
        run: python refresh_college_talent.py

      - name: Refresh authorized NFL research profile
        if: github.event_name != 'push'
        run: python refresh_nfl_advanced_metrics.py

      # The "ONE-TIME seed merge" step that used to live here was removed
      # 2026-07-27. It was never actually one-time -- it ran on EVERY run and
      # re-added all 19 seed picks under their original fixture keys, because
      # its `if mid not in current` check compares against keys that
      # _quarantine_legacy_records() has since renamed to "legacy:<id>". Each
      # run therefore re-seeded 19 plain keys, which that function then
      # renamed to "legacy:<id>:2", ":3", ... growing picks_log_wc.json by 19
      # duplicate records per run (measured: 19 real fixtures stored as 38
      # records) and inflating the scorecard's all-time legacy tally with
      # copies of the same picks. The re-seeded copies also carried the old
      # penalty-inflated scorelines ("3-5" instead of "1-1 (2-4 pens)") that
      # update_scorecard()'s self-heal pass had already corrected, so every
      # run reintroduced data the app had explicitly fixed.
      #
      # It is safe to drop outright: picks_log_wc.json is now tracked in git
      # (see .gitignore) and committed back after every fetch, so the ledger
      # persists on its own and no longer needs re-seeding from
      # seed_picks_log_wc.json (kept in the repo as the historical record of
      # what was originally seeded).

      - name: Fetch one adaptive round for all sports
        if: github.event_name != 'push'
        id: adaptive-fetch
        continue-on-error: true
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild && 'true' || 'false' }}
        run: |
          if [ "$FORCE_REBUILD" = "true" ]; then
            python multi_fetch.py --once --force
          else
            python multi_fetch.py --once
          fi

      - name: Report degraded provider refresh without blocking site deployment
        if: github.event_name != 'push' && steps.adaptive-fetch.outcome == 'failure'
        run: |
          echo "::warning::One or more providers failed after retry. Deploying the structurally validated last-good fixture snapshots recovered before refresh."

      - name: Grade frozen MLB challenger evidence
        if: github.event_name != 'push'
        run: |
          if [ -f mlb_shadow_ledger.jsonl ]; then
            python build_mlb_prospective_scorecard.py --ledger mlb_shadow_ledger.jsonl --output mlb_prospective_scorecard.json
          elif [ -f forecast_ledger_mlb.jsonl ]; then
            python build_mlb_prospective_scorecard.py --ledger forecast_ledger_mlb.jsonl --output mlb_prospective_scorecard.json
          else
            echo "no MLB shadow or legacy forecast ledger yet; prospective scorecard remains pending"
          fi

      - name: Grade frozen NFL calibrated-Elo evidence
        if: github.event_name != 'push'
        run: |
          if [ -f forecast_ledger_nfl.jsonl ]; then
            python build_nfl_prospective_scorecard.py --ledger forecast_ledger_nfl.jsonl --output nfl_prospective_scorecard.json
          else
            echo "no NFL forecast ledger yet; prospective scorecard remains pending"
          fi

      - name: Segment model losses against the closing market
        if: github.event_name != 'push'
        run: |
          files=(forecast_ledger_*.jsonl)
          if [ -f market_snapshot_ledger.jsonl ] && [ -e "${files[0]}" ]; then
            python build_market_benchmark.py --forecast-ledger "${files[@]}" --market-ledger market_snapshot_ledger.jsonl --output market_benchmark_report.json
          else
            echo "market/forecast receipts have not accumulated yet; benchmark remains pending"
          fi

      - name: Populate authorized research reasoning into cached fixtures
        run: python populate_research_signals.py

      - name: Commit updated ratings and picks ledger back to the repo
        if: github.event_name != 'push'
        # EVERY ratings*.json file (Elo, and every per-competition curated/
        # enriched class-rating file -- ratings.json, ratings_ncaaf.json,
        # ratings_bundesliga.json, etc.) is git-tracked, and all of them used
        # to also be matched by the cache step above -- the cache's
        # restore-keys fallback would silently restore an older cached copy
        # over the freshly-checked-out file every run, discarding real
        # enrichment (talent/recruiting strength, championship-odds strength,
        # historical Elo) and reintroducing stale/contaminated data none of
        # this session's fixes could see, since they never ran against it.
        # Confirmed live 2026-07-26: this exact bug flipped Alabama's class
        # score negative relative to East Carolina's on the live site, even
        # though the underlying provider data was correct. Committing the
        # real per-run result back here, instead of relying on the cache,
        # makes git the one source of truth for every ratings file.
        #
        # picks_log*.json joined this step 2026-07-27 for the identical
        # reason: it was cache-only (see .gitignore's prior entry for it) and
        # a single cache-restore hiccup silently reset the entire pick-lock
        # ledger to empty with zero error trace -- confirmed live the same
        # day. The scorecard's whole "verified pregame picks, locked in
        # public, never rewritten" claim depends on this ledger actually
        # persisting, so it gets the same durable-source-of-truth treatment.
        #
        # forecast_ledger_*.jsonl and mlb_shadow_ledger.jsonl joined
        # 2026-08-18 for the third instance of the same reason. They were
        # cache-only, and they hold the append-only prospective receipts that
        # the NFL calibrated-Elo gate and the MLB promotion/recovery gates are
        # graded from -- nfl_model_adjustment.json sits at
        # prospective_status: "collecting_prospective_evidence" with the NFL
        # season about to start writing exactly that evidence. A cache miss
        # would erase it with no error trace, and unlike a ratings file it
        # cannot be recomputed afterwards: a pregame lock is only worth
        # anything because it was recorded before the result existed. The
        # grading steps above are guarded by `if [ -f ... ]`, so a silent loss
        # degrades to a cheerful "pending" rather than a failure.
        #
        # These files start untracked the first run after that .gitignore
        # change, and `git diff` (unlike `git diff --cached`) ignores
        # untracked files -- so `git add` has to run before the check below,
        # not be conditioned on it, or that first real commit would be
        # silently skipped. [skip ci] stops this from re-triggering the
        # workflow via its own `push: branches: [main]` trigger.
        run: |
          git config user.name "matchday-bot"
          git config user.email "actions@github.com"
          git add -- 'ratings*.json' ':!ratings*.backup.json' ':!ratings*.legacy.json' ':!ratings*.raced-preserved.json' 'picks_log*.json'
          # `git add` fails the ENTIRE step on a pathspec matching nothing
          # (verified: exit 128, "did not match any files"), and these ledgers
          # legitimately may not exist -- mlb_shadow_ledger.jsonl before the
          # first shadow lock, forecast_ledger_*.jsonl on a cold checkout.
          # Naming them as literal pathspecs would therefore fail the build
          # job, and with it the hourly site deploy, on exactly the runs where
          # nothing was wrong. Collect only the ledgers actually present.
          ledgers=$(ls forecast_ledger_*.jsonl mlb_shadow_ledger.jsonl 2>/dev/null || true)
          if [ -n "$ledgers" ]; then
            git add -- $ledgers
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update ratings and picks ledger [skip ci]"
            persisted=false
            for attempt in 1 2 3; do
              # The fetch leaves other generated site files intentionally
              # unstaged for the deployment artifact. Push the durable commit
              # directly first; only rebase if main actually moved while this
              # job was running. --autostash keeps those in-run files intact.
              if git push origin HEAD:main; then
                persisted=true
                break
              fi
              echo "ratings/picks persistence attempt $attempt lost a race; rebasing against latest main"
              if ! git pull --rebase --autostash origin main; then
                git rebase --abort 2>/dev/null || true
              fi
              sleep 2
            done
            if [ "$persisted" != true ]; then
              echo "::warning::Could not persist refreshed ratings/picks after three rebased attempts. Continuing with the validated in-run files so site deployment is not blocked."
            fi
          else
            echo "no ratings or picks files changed, nothing to commit"
          fi

      - name: Assemble public site (curated allowlist only)
        run: |
          rm -f config_keys.py
          mkdir -p _site
          cp index.html styles.css research-signals.css content.css content.js article-links.js translations.js updates.js legal.html qa.html content.html manifest.json _site/
          cp tactics-soccer.html tactics-football.html tactics-basketball.html tactics-hockey.html tactics-baseball.html _site/
          cp robots.txt sitemap.xml _site/
          cp app-1-core.js app-2-views.js app-3-panels.js app-4-features.js app-5-outcome-tree.js research-signals.js official-selections.js _site/
          cp favicon.ico favicon-16.png favicon-32.png matchday.ico _site/
          cp icon-180.png icon-192.png icon-512.png logo.png _site/
          if [ ! -f data.json ]; then
            for fallback in data_mlb.json data_wc.json data_nfl.json data_ncaaf.json; do
              if [ -f "$fallback" ]; then cp "$fallback" data.json; break; fi
            done
          fi
          cp data.json _site/
          for data_file in data_wc.json data_ucl.json data_epl.json data_laliga.json data_seriea.json data_bundesliga.json data_ligue1.json data_nfl.json data_ncaaf.json data_ncaam.json data_nba.json data_mlb.json; do
            [ ! -f "$data_file" ] || cp "$data_file" _site/
          done
          # Failure tracebacks stay in the private Actions cache/log. Publishing
          # internal paths and provider error bodies to the public site creates
          # avoidable information disclosure even after credential scrubbing.
          cp content-feed.json _site/
          mkdir -p _site/posts
          python - <<'EOF'
          import json, pathlib, shutil
          # Editorial desk posts may cover the whole non-MLB board rather
          # than a single competition. Keep those `comp: "all"` pages in
          # the same explicit public allowlist as the competition posts.
          public = {"all", "wc", "ucl", "epl", "laliga", "seriea", "bundesliga", "ligue1", "nfl", "ncaaf", "ncaam", "nba", "mlb"}
          try:
              posts = json.loads(pathlib.Path("posts.json").read_text(encoding="utf-8"))
          except Exception:
              posts = []
          posts = [post for post in posts if str(post.get("comp", "")).lower() in public]
          pathlib.Path("_site/posts.json").write_text(json.dumps(posts, ensure_ascii=False, indent=1), encoding="utf-8")
          for post in posts:
              source = pathlib.Path("posts") / f"{post.get('slug') or post.get('id')}.html"
              if source.is_file():
                  shutil.copy2(source, pathlib.Path("_site/posts") / source.name)
          # Research posts (docs/experiments.json-derived write-ups) are a
          # separate feed from the recap posts above -- no comp allowlist
          # needed since they're never per-competition, but they need the
          # same explicit copy or the in-app Insights "Research" section
          # fetches a 404 on the live site despite working locally.
          try:
              research_posts = json.loads(pathlib.Path("research_posts.json").read_text(encoding="utf-8"))
          except Exception:
              research_posts = []
          pathlib.Path("_site/research_posts.json").write_text(json.dumps(research_posts, ensure_ascii=False, indent=1), encoding="utf-8")
          for post in research_posts:
              source = pathlib.Path("posts") / f"{post.get('slug') or post.get('id')}.html"
              if source.is_file():
                  shutil.copy2(source, pathlib.Path("_site/posts") / source.name)
          EOF

      - name: Stamp asset URLs with this commit's SHA (cache-busting)
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" _site/index.html _site/content.html _site/tactics-*.html

      # v3's action.yml internally calls actions/upload-artifact@v4 (an
      # unpinned tag) to build the artifact -- fine on its own, but the repo's
      # policy now requires every action pinned to a full SHA and validates
      # that transitively into composite actions' own internal `uses:`
      # lines, so v3 fails even though this workflow's own reference to it
      # WAS pinned (confirmed live: run #213 failed on that inner
      # actions/upload-artifact@v4, not on this line). v5 pins its internal
      # call (to actions/upload-artifact@v7.0.0, itself a real SHA) --
      # verified both SHAs below against their real upstream tags via the
      # GitHub API. Same path/name/retention-days input contract as v3, plus
      # one new optional input (include-hidden-files) this workflow doesn't
      # use.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
