name: Refresh data and deploy

on:
  schedule:
    # Matchday publishes pregame analysis and postgame grading, not live
    # scores. Hourly checks are enough to lock near-kickoff picks and collect
    # final results without spending scarce provider quota on scoreboard duty.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      quota_bootstrap:
        description: 'Allow one deliberate call per protected provider when the private quota ledger is missing'
        required: false
        type: boolean
        default: false
      force_rebuild:
        description: 'Ignore adaptive cadence once and rebuild every competition'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Published so the freshness alarm can go red in its own job. Failing the
    # build over stale data would skip the deploy entirely and leave the site
    # on even older content -- the opposite of the fix.
    outputs:
      freshness: ${{ steps.freshness.outcome }}
    env:
      # Scheduled runs fail closed on a cold cache. A human may explicitly
      # authorize one bootstrap response so real provider headers can seed the
      # private ledger; ordinary dispatches remain protected too.
      MATCHDAY_QUOTA_ALLOW_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.quota_bootstrap && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Restore fetch state (odds, CI cadence)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci_fetch_state.json
            provider_quota_state.json
            data.json
            data_*.json
            odds_open*.json
            title_open*.json
            *_cache.json
            # odds_market_cache_<comp>.json / outrights_market_cache_<comp>.json
            # put "cache" BEFORE the per-competition suffix, so *_cache.json
            # (which needs the filename to END in "_cache.json") never matched
            # them, and every run re-fetched from the provider regardless of
            # the intended cache window.
            odds_market_cache_*.json
            advanced_metrics_*.json
            ncaaf_venue_coords.json
            market_snapshot_ledger.jsonl
            next_task.json
            ui_audit_report.json
            # posts.json / posts_state.json / posts/*.html are NOT cached.
            # They are git-tracked and committed back below, and caching a
            # tracked file means the restore-keys fallback lands an older
            # copy on top of the checked-out one every run -- the clobber
            # already documented for ratings*.json. It cost 13 consecutive
            # hourly deploys: generate_posts.py's comp filter culled the
            # editorial posts, the culled posts.json was cached, and it was
            # then restored over every fixed checkout, so the source fix
            # could not take effect.
            fetch_failure_*.json
          key: matchday-fetch-state-${{ github.run_id }}
          restore-keys: matchday-fetch-state-

      # AGENTS.md documents a core set as required before considering any
      # prediction/data/provider change complete, but nothing previously
      # enforced that -- a regression could merge to main and start
      # deploying hourly with the suite never having actually run. Runs
      # early enough to block both the ratings/picks commit and the site
      # deploy below if it fails, since a broken prediction/provider path
      # is exactly what those steps would otherwise ship.
      #
      # Was a hand-maintained list of 30 module names (2026-08-20): that
      # covered 659 tests and left 26 modules / 159 tests on disk gating
      # nothing at all -- including test_pick_lock_persistence,
      # test_forecast_ledger, test_recovered_mlb_picks and
      # test_outcome_tree, i.e. exactly the suites protecting the
      # "locked in public, never rewritten" claim the scorecard rests on.
      # A hardcoded list also fails open: every new test_*.py was
      # unprotected by default until someone remembered to edit this line,
      # which is how the gap opened in the first place. Discovery finds all
      # 56 modules / 818 tests, verified passing together and in reverse
      # order, so this closed the gap without changing any test.
      - name: Run required test suite
        run: python -m unittest discover -p "test_*.py"

      - name: Recover published last-good fixtures after a cold cache miss
        run: python recover_published_data.py

      - name: Write private keys from secrets (never committed)
        run: |
          cat > config_keys.py <<EOF
          CFBD_KEY = "${{ secrets.CFBD_KEY }}"
          CBBD_KEY = "${{ secrets.CBBD_KEY }}"
          ODDS_API_KEY = "${{ secrets.ODDS_API_KEY }}"
          SPORTSGAMEODDS_KEY = "${{ secrets.SPORTSGAMEODDS_KEY }}"
          SPORTSDATAIO_KEY = "${{ secrets.SPORTSDATAIO_KEY }}"
          EOF

      # updates.js is generated from updates/*.json and committed only so a
      # plain static file server works locally. Regenerating here means a
      # forgotten `python build_updates.py` can never ship a stale release-note
      # list or a stale build label (both are now derived from the newest
      # entry), and --check fails loudly if the committed copy had drifted.
      - name: Verify and rebuild release notes
        run: |
          python build_updates.py --check || echo "::warning::updates.js was out of sync with updates/; rebuilding"
          python build_updates.py

      # Stadium coordinates for the weather lookup. One licensed CFBD call the
      # first time, then skipped forever -- stadiums do not move. Without it
      # 145 of 160 upcoming NCAAF fixtures resolved to no coordinates and
      # silently published with no forecast. Never blocks: a missing forecast
      # is an absent enrichment, not a reason to stop deploying picks.
      - name: Recover durable NCAAF venue coordinates
        continue-on-error: true
        run: python refresh_ncaaf_venues.py

      - name: Fetch one adaptive round for all sports
        if: github.event_name != 'push'
        id: adaptive-fetch
        continue-on-error: true
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild && 'true' || 'false' }}
        run: |
          if [ "$FORCE_REBUILD" = "true" ]; then
            python multi_fetch.py --once --force
          else
            python multi_fetch.py --once
          fi

      - name: Report degraded provider refresh without blocking site deployment
        if: github.event_name != 'push' && steps.adaptive-fetch.outcome == 'failure'
        run: |
          echo "::warning::One or more providers failed after retry. Deploying the structurally validated last-good fixture snapshots recovered before refresh."

      # The browser repairs a quota-starved NCAAF board from the Bet Better
      # handoff (see applyCurrentCfbSnapshot in app-3-panels.js), but only as
      # far as whatever `matchday-cfb-snapshot.js` happens to contain -- and
      # nothing in this workflow ever rebuilt it. The snapshot was therefore
      # frozen at whenever someone last ran the builder by hand, so the one
      # mechanism that covers for a dead fixture feed went stale in exactly the
      # circumstances it exists for. Rebuilding it here costs no provider quota:
      # the handoff is a committed file, not a fetch.
      - name: Rebuild the Bet Better repair layer from the committed handoff
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          if [ -f betbetter_picks.json ]; then
            python build_cfb_snapshot.py
          else
            echo "::warning::betbetter_picks.json is absent; the NCAAF board keeps whatever repair layer is committed."
          fi

      # Both product loops run before next_task.py so their reports are on
      # disk when it ranks. Neither can fail the build: an undersized tap
      # target and a thin pick log are things to work on, not reasons to stop
      # publishing, and the site going dark over a contrast ratio would be a
      # worse outcome than the contrast ratio. Findings reach a human through
      # the ranked task, not through a red build.
      - name: Audit the shipped interface against accessibility rules
        if: github.event_name != 'push'
        continue-on-error: true
        run: python ui_audit.py --output ui_audit_report.json

      # Runs after every report step above so it ranks this run's evidence.
      # Never blocks the build.
      - name: Rank the next task from accumulated evidence
        if: github.event_name != 'push'
        continue-on-error: true
        run: python next_task.py --output next_task.json

      # The one step that answers "did this run actually publish current data?"
      #
      # Every refresh step above is `continue-on-error`, and the fetch failure
      # handler downgrades a dead provider to a warning so the site can still
      # serve its last-good snapshot. That is right for one bad hour and wrong
      # for the fiftieth in a row, and nothing distinguished the two: NCAAF
      # went five days without a published result while every run stayed green.
      #
      # So this reports, and it is allowed to go red. It reads only what is on
      # disk -- no provider calls, no quota -- and it judges results *after* the
      # Bet Better repair layer, because that is what a reader actually sees. It
      # runs before the deploy but does not gate it: the site still ships, and
      # `continue-on-error` here keeps the result on the job while the final
      # step below is what turns a sustained stall into a failed run someone
      # gets mailed about.
      - name: Check the data the site is about to serve is current
        if: github.event_name != 'push'
        id: freshness
        continue-on-error: true
        run: python data_freshness.py --output data_freshness_report.json --github

      - name: Populate authorized research reasoning into cached fixtures
        run: python populate_research_signals.py

      - name: Commit durable generated files back to the repo
        if: github.event_name != 'push'
        # market_snapshot_ledger.jsonl is committed rather than cached because
        # a market price cannot be recomputed: what the closing consensus said
        # at a kickoff that has already happened is unrecoverable the moment it
        # is lost -- there is no endpoint, no backfill, and no provider that
        # will sell it back. It was once cached but never committed, and one
        # cache miss silently zeroed it with no error trace.
        #
        # These files start untracked the first run after that .gitignore
        # change, and `git diff` (unlike `git diff --cached`) ignores
        # untracked files -- so `git add` has to run before the check below,
        # not be conditioned on it, or that first real commit would be
        # silently skipped. [skip ci] stops this from re-triggering the
        # workflow via its own `push: branches: [main]` trigger.
        run: |
          git config user.name "matchday-bot"
          git config user.email "actions@github.com"
          # The published editorial record. posts.json, the due-ledger that
          # decides whether a recap has already gone out, and the rendered
          # pages must move together in one commit or the site links posts
          # whose HTML 404s. Uses the same present-files-only collection as
          # the ledgers below because `git add` exits 128 on a pathspec that
          # matches nothing, which would fail the job -- and with it the
          # deploy -- on a run where nothing was wrong.
          published=$(ls posts.json 2>/dev/null || true)
          if [ -n "$published" ]; then
            git add -- $published
          fi
          if ls posts/*.html >/dev/null 2>&1; then
            git add -- 'posts/*.html' ':!posts/research-*.html'
          fi
          # Durable and slow-moving: committing it means the one CFBD call
          # never has to be spent again, even on a cold cache.
          if [ -f ncaaf_venue_coords.json ]; then
            git add -- ncaaf_venue_coords.json
          fi
          # The AP poll's week-to-week movement is measured against the last
          # stored poll, so the stored poll has to move when the AP's does.
          if [ -f ap_poll_snapshot.json ]; then
            git add -- ap_poll_snapshot.json
          fi
          if [ -f ap_poll_ncaam_snapshot.json ]; then
            git add -- ap_poll_ncaam_snapshot.json
          fi
          # `git add` fails the ENTIRE step on a pathspec matching nothing
          # (verified: exit 128, "did not match any files"), and these ledgers
          # legitimately may not exist on a cold checkout.
          # Naming them as literal pathspecs would therefore fail the build
          # job, and with it the hourly site deploy, on exactly the runs where
          # nothing was wrong. Collect only the ledgers actually present.
          ledgers=$(ls market_snapshot_ledger.jsonl 2>/dev/null || true)
          if [ -n "$ledgers" ]; then
            git add -- $ledgers
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update market ledger and generated files [skip ci]"
            persisted=false
            for attempt in 1 2 3; do
              # The fetch leaves other generated site files intentionally
              # unstaged for the deployment artifact. Push the durable commit
              # directly first; only rebase if main actually moved while this
              # job was running. --autostash keeps those in-run files intact.
              if git push origin HEAD:main; then
                persisted=true
                break
              fi
              echo "ratings/picks persistence attempt $attempt lost a race; rebasing against latest main"
              if ! git pull --rebase --autostash origin main; then
                git rebase --abort 2>/dev/null || true
              fi
              sleep 2
            done
            if [ "$persisted" != true ]; then
              echo "::warning::Could not persist refreshed ratings/picks after three rebased attempts. Continuing with the validated in-run files so site deployment is not blocked."
            fi
          else
            echo "no ratings or picks files changed, nothing to commit"
          fi

      - name: Assemble public site (curated allowlist only)
        run: |
          rm -f config_keys.py
          mkdir -p _site
          cp index.html styles.css bracketology.css research-signals.css article-links.js translations.js updates.js legal.html qa.html roadmap.html manifest.json _site/
          cp robots.txt sitemap.xml _site/
          # Bet Better owns this handoff. Missing data stays visibly unavailable.
          if [ -f bracketology_ncaam.json ]; then cp bracketology_ncaam.json _site/; fi
          cp app-bracketology.js app-1-core.js app-2-views.js app-3-panels.js app-4-features.js research-signals.js matchday-cfb-snapshot.js _site/
          cp favicon.ico favicon-16.png favicon-32.png matchday.ico _site/
          cp icon-180.png icon-192.png icon-512.png _site/
          mkdir -p _site/assets/welcome _site/assets/fonts
          cp assets/welcome/college-athletes-illustrated.webp _site/assets/welcome/
          cp assets/fonts/oxanium-700.ttf assets/fonts/Oxanium-OFL.txt _site/assets/fonts/
          mkdir -p _site/team-logos
          cp social/logos/*.png _site/team-logos/
          if [ ! -f data.json ]; then
            for fallback in data_mlb.json data_wc.json data_nfl.json data_ncaaf.json; do
              if [ -f "$fallback" ]; then cp "$fallback" data.json; break; fi
            done
          fi
          cp data.json _site/
          for data_file in data_ncaaf.json data_ncaam.json; do
            comp="${data_file#data_}"
            comp="${comp%.json}"
            [ ! -f "$data_file" ] || python build_public_payload.py "$data_file" "_site/$data_file" "$comp"
          done
          # Failure tracebacks stay in the private Actions cache/log. Publishing
          # internal paths and provider error bodies to the public site creates
          # avoidable information disclosure even after credential scrubbing.
          mkdir -p _site/posts
          python - <<'EOF'
          import json, pathlib, shutil
          # Editorial desk posts may cover the whole non-MLB board rather
          # than a single competition. Keep those `comp: "all"` pages in
          # the same explicit public allowlist as the competition posts.
          public = {"all", "wc", "ucl", "epl", "laliga", "seriea", "bundesliga", "ligue1", "nfl", "ncaaf", "ncaam", "nba", "mlb"}
          try:
              posts = json.loads(pathlib.Path("posts.json").read_text(encoding="utf-8"))
          except Exception:
              posts = []
          posts = [post for post in posts if str(post.get("comp", "")).lower() in public]
          pathlib.Path("_site/posts.json").write_text(json.dumps(posts, ensure_ascii=False, indent=1), encoding="utf-8")
          for post in posts:
              source = pathlib.Path("posts") / f"{post.get('slug') or post.get('id')}.html"
              if source.is_file():
                  shutil.copy2(source, pathlib.Path("_site/posts") / source.name)
          # Research posts (docs/experiments.json-derived write-ups) are a
          # separate feed from the recap posts above -- no comp allowlist
          # needed since they're never per-competition, but they need the
          # same explicit copy or the in-app Insights "Research" section
          # fetches a 404 on the live site despite working locally.
          try:
              research_posts = json.loads(pathlib.Path("research_posts.json").read_text(encoding="utf-8"))
          except Exception:
              research_posts = []
          pathlib.Path("_site/research_posts.json").write_text(json.dumps(research_posts, ensure_ascii=False, indent=1), encoding="utf-8")
          for post in research_posts:
              source = pathlib.Path("posts") / f"{post.get('slug') or post.get('id')}.html"
              if source.is_file():
                  shutil.copy2(source, pathlib.Path("_site/posts") / source.name)
          EOF

      - name: Stamp asset URLs with this commit's SHA (cache-busting)
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" _site/index.html

      # v3's action.yml internally calls actions/upload-artifact@v4 (an
      # unpinned tag) to build the artifact -- fine on its own, but the repo's
      # policy now requires every action pinned to a full SHA and validates
      # that transitively into composite actions' own internal `uses:`
      # lines, so v3 fails even though this workflow's own reference to it
      # WAS pinned (confirmed live: run #213 failed on that inner
      # actions/upload-artifact@v4, not on this line). v5 pins its internal
      # call (to actions/upload-artifact@v7.0.0, itself a real SHA) --
      # verified both SHAs below against their real upstream tags via the
      # GitHub API. Same path/name/retention-days input contract as v3, plus
      # one new optional input (include-hidden-files) this workflow doesn't
      # use.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Turns a sustained stall into something a human is told about.
  #
  # This is the whole point of the freshness check: the site had been serving a
  # frozen NCAAF board for five days across roughly 120 consecutive green runs,
  # because every refresh step is allowed to fail softly and nothing ever
  # asserted the result. This job asserts it.
  #
  # It runs after the deploy and the deploy does not depend on it, so a red
  # alarm never costs the site a publish -- the current content ships either
  # way, and the failure is the notification. `if: always()` so a stall is still
  # reported when an earlier job went down for its own reasons.
  freshness-alarm:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fail the run when the deployed data is stale
        run: |
          if [ "${{ needs.build.outputs.freshness }}" = "failure" ]; then
            echo "::error::Deployed data is stale -- see the 'Check the data the site is about to serve is current' step for which competitions and which fixtures. The site still deployed its last-good content."
            exit 1
          fi
          echo "Data freshness check passed."
