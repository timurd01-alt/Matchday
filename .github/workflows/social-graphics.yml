name: Render the week's graphics

# Renders this week's Matchday Studio graphics (Top 25 power ratings, Top 25
# ballot, Top 5 matchups, Upset Watch when there are three) as 2160x3840 PNGs,
# and this week's TikTok videos (1080x1920 MP4, 10-30 s, no audio), and
# attaches both to the run as artifacts, each with a manifest naming every
# file's caption, source hash and expiry.
#
#   * Publishes nothing: this is the full weekly set for a person to look at.
#     Scheduled posting is social-post.yml, which renders only what it sends.
#   * Commits nothing. Images and videos are 1-3 MB each; they live on the
#     run, not in git.
#   * Says nothing when there is nothing to say: a stale handoff or a short
#     slate renders no images and the job still succeeds.
#
# Sunday 23:30 UTC, half an hour after weekly-slate.yml, and a Tuesday catch-up.
on:
  schedule:
    - cron: '30 23 * * 0'
    - cron: '30 13 * * 2'
  workflow_dispatch:

concurrency:
  group: matchday-social-graphics
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # imageio-ffmpeg ships the ffmpeg build (with libx264) the videos are
      # encoded with, so CI and a local run use the same encoder.
      - name: Install the headless browser and encoder
        run: |
          python -m pip install playwright==1.63.0 imageio-ffmpeg==0.6.0
          python -m playwright install --with-deps chromium

      # Full discovery, the same command as every other workflow. With
      # Playwright and imageio-ffmpeg installed, the studio render and video
      # encode tests run here instead of being skipped.
      - name: Run the test suite
        run: python -m unittest discover -p "test_*.py"

      - name: Render the graphics
        run: python render_social.py --out out/graphics

      - name: Attach the graphics to this run
        if: ${{ hashFiles('out/graphics/manifest.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matchday-graphics-${{ github.run_number }}
          path: out/graphics
          retention-days: 21

      - name: Render the videos
        run: python render_reels.py --out out/videos

      - name: Attach the videos to this run
        if: ${{ hashFiles('out/videos/manifest.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matchday-videos-${{ github.run_number }}
          path: out/videos
          retention-days: 21
